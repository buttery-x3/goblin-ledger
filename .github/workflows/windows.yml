name: Windows acceptance
on:
  pull_request:
  push:
    branches: [development, main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
      - run: node scripts/workspace-dom.mjs
      - run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: GoblinLedger-windows
          path: dist/GoblinLedger-windows.zip
          if-no-files-found: error
  addon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y lua5.1
      - run: lua5.1 addon/tests/capture.lua
