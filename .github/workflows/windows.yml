name: Windows acceptance
on:
  pull_request:
  push:
    branches: [development, main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Probe public market contracts (US diagnostic)
        run: node scripts/probe-market.mjs us
      - name: Resolve initial lock for review
        if: ${{ hashFiles('pnpm-lock.yaml') == '' }}
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          node -e "console.log('RESOLVED_LOCK',require('node:zlib').gzipSync(require('node:fs').readFileSync('pnpm-lock.yaml')).toString('base64'))"
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm smoke
